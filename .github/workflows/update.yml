name: update-news
on:
  schedule:
    - cron: '*/53 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: node scripts/fetch-news.js
      - name: Commit se mudou
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add public/news.json
          git diff --staged --quiet || (git commit -m "chore: atualiza notícias" && git push)
